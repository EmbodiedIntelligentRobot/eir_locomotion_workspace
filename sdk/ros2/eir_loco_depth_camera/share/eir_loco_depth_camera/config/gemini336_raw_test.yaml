# Orbbec Gemini 336 raw-depth characterization profile.
# One camera directly connected to each control host; launch defaults to USB UID 4-3.
# No fleet-specific serial here.
# Multiple cameras on one host require usb_port or serial_number at launch.
device_num: 1
enumerate_net_device: false
uvc_backend: libuvc
depth_width: 640
depth_height: 480
depth_fps: 60
depth_format: Y16
depth_qos: SENSOR_DATA
enable_depth: true
enable_color: false
enable_left_ir: false
enable_right_ir: false
enable_accel: false
enable_gyro: false
enable_point_cloud: false
publish_tf: false
depth_registration: false
time_domain: global
enable_frame_sync: true
enable_laser: true
enable_ldp: true
enable_depth_scale: true
depth_precision: 1mm

# Keep the raw-driver test free of optional depth post-processing.  The
# required hardware disparity-to-depth conversion remains enabled.
enable_decimation_filter: false
enable_hdr_merge: false
enable_sequence_id_filter: false
enable_threshold_filter: false
enable_hardware_noise_removal_filter: false
enable_noise_removal_filter: false
enable_spatial_filter: false
enable_temporal_filter: false
enable_hole_filling_filter: false
enable_spatial_fast_filter: false
enable_spatial_moderate_filter: false
enable_disparity_to_depth: true

# Publish only the standard sensor_msgs/Image transport used by the test.
depth.image_raw.enable_pub_plugins: [image_transport/raw]
log_level: info
